<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>250 книг · трекер</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf8f4;--surface:#fff;--ink:#1a1714;--ink2:#5c5650;--ink3:#a09890;--accent:#7c3e1a;--al:#f2e8df;--gold:#c8933f;--border:#e8e2d8;--done:#f0f7ee;--dink:#3a7a2a;--r:8px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh}
.hero{background:var(--ink);color:#faf8f4;padding:2rem 2rem 1.8rem;text-align:center}
.eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:.5rem}
.hero h1{font-family:'Playfair Display',serif;font-size:clamp(1.7rem,4vw,2.6rem);font-weight:700;line-height:1.15;margin-bottom:.4rem}
.hero p{font-size:12px;color:#a09890;font-weight:300}
.prog-bar{max-width:1100px;margin:0 auto;padding:.9rem 1.5rem;display:flex;align-items:center;gap:1.2rem;border-bottom:1px solid var(--border)}
.track{flex:1;height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:3px;transition:width .5s}
.stats{display:flex;gap:1.2rem;flex-shrink:0}
.stat{text-align:center}
.stat-n{font-family:'Playfair Display',serif;font-size:1.25rem;font-weight:700;line-height:1}
.stat-l{font-size:9px;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
.controls{max-width:1100px;margin:0 auto;padding:.8rem 1.5rem;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid var(--border)}
.sw{flex:1;min-width:180px;position:relative}
.sw input{width:100%;padding:7px 12px 7px 30px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);font-size:13px;font-family:'Inter',sans-serif;color:var(--ink);outline:none}
.sw input:focus{border-color:var(--accent)}
.si{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--ink3);font-size:11px;pointer-events:none}
.fbtns{display:flex;gap:5px;flex-wrap:wrap}
.fb{padding:5px 11px;border-radius:20px;font-size:11px;font-family:'Inter',sans-serif;font-weight:500;border:1px solid var(--border);background:var(--surface);color:var(--ink2);cursor:pointer;transition:all .15s}
.fb:hover{border-color:var(--accent);color:var(--accent)}
.fb.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.gtabs{max-width:1100px;margin:0 auto;padding:0 1.5rem;display:flex;overflow-x:auto;border-bottom:1px solid var(--border);scrollbar-width:none}
.gtabs::-webkit-scrollbar{display:none}
.gt{padding:8px 11px;font-size:11px;font-weight:500;color:var(--ink3);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s;flex-shrink:0}
.gt:hover{color:var(--ink2)}
.gt.on{color:var(--accent);border-bottom-color:var(--accent)}
.tw{max-width:1100px;margin:0 auto;padding:0 1.5rem 4rem;overflow-x:auto}
table{width:100%;border-collapse:collapse;margin-top:.6rem}
thead th{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.1em;color:var(--ink3);padding:6px 10px;text-align:left;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;white-space:nowrap}
thead th:hover{color:var(--ink2)}
thead th.s{color:var(--accent)}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s;cursor:pointer}
tbody tr:hover{background:#f5f1eb}
tbody tr.r{background:var(--done)}
tbody tr.r:hover{background:#e6f2e4}
td{padding:9px 10px;font-size:13px;vertical-align:middle}
.cn{font-size:11px;color:var(--ink3);font-weight:300;width:30px;text-align:right;padding-right:6px}
.cc{width:26px}
.ck{width:19px;height:19px;border-radius:50%;border:1.5px solid var(--border);display:inline-flex;align-items:center;justify-content:center;font-size:10px;transition:all .15s}
.r .ck{background:var(--dink);border-color:var(--dink);color:#fff}
.ct{font-weight:500;min-width:160px}
.r .ct{color:var(--dink)}
.ca{color:var(--ink2);min-width:130px}
.cg{min-width:100px}
.pill{display:inline-block;font-size:9px;padding:2px 7px;border-radius:20px;font-weight:500;background:var(--al);color:var(--accent)}
.ch{color:var(--ink3);text-align:right;white-space:nowrap;padding-right:0}
.empty{text-align:center;padding:3rem;color:var(--ink3);font-size:14px}
@media(max-width:600px){.ch,.cg{display:none}}
</style>
</head>
<body>

<div class="hero">
  <div class="eyebrow">Читательский трекер</div>
  <h1>250 книг, которые стоит прочитать</h1>
  <p>Классика · Философия · Психология · Наука · Фантастика · Бизнес · Восток · История</p>
</div>

<div class="prog-bar">
  <div class="stats">
    <div class="stat"><div class="stat-n" id="sR">0</div><div class="stat-l">прочитано</div></div>
    <div class="stat"><div class="stat-n" id="sL">250</div><div class="stat-l">осталось</div></div>
    <div class="stat"><div class="stat-n" id="sP">0%</div><div class="stat-l">прогресс</div></div>
  </div>
  <div class="track"><div class="fill" id="fill" style="width:0%"></div></div>
</div>

<div class="controls">
  <div class="sw"><span class="si">🔍</span><input id="q" placeholder="Поиск по названию или автору…" oninput="render()"></div>
  <div class="fbtns">
    <button class="fb on" data-f="all" onclick="setF(this)">Все</button>
    <button class="fb" data-f="unread" onclick="setF(this)">Не читал</button>
    <button class="fb" data-f="read" onclick="setF(this)">Прочитал</button>
  </div>
</div>

<div class="gtabs" id="gtabs"></div>

<div class="tw">
  <table>
    <thead><tr>
      <th class="cn" onclick="srt('n')">#</th>
      <th class="cc"></th>
      <th onclick="srt('title')">Название</th>
      <th onclick="srt('author')">Автор</th>
      <th onclick="srt('g')">Жанр</th>
      <th onclick="srt('h')">Часов</th>
    </tr></thead>
    <tbody id="tb"></tbody>
  </table>
  <div class="empty" id="emp" style="display:none">Ничего не найдено</div>
</div>

// deduplicate, trim to 250
const seen=new Set(), BOOKS=[];
for(const b of RAW){
  if(seen.has(b.title)||!b.g) continue;
  seen.add(b.title);
  BOOKS.push({...b,n:BOOKS.length+1});
  if(BOOKS.length===250) break;
}

const GENRES=['Все',...new Set(BOOKS.map(b=>b.g))];
let state={},filt='all',genre='Все',sk='n',sd=1;

function load(){try{state=JSON.parse(localStorage.getItem('bk250')||'{}')}catch(e){}}
function save(){localStorage.setItem('bk250',JSON.stringify(state))}
function toggle(n){state[n]=!state[n];save();render()}

function setF(el){
  filt=el.dataset.f;
  document.querySelectorAll('.fb').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');render();
}
function setG(g){
  genre=g;
  document.querySelectorAll('.gt').forEach(t=>t.classList.remove('on'));
  document.getElementById('g_'+encodeURIComponent(g)).classList.add('on');
  render();
}
function srt(k){if(sk===k)sd*=-1;else{sk=k;sd=1;}render();}

function buildTabs(){
  const w=document.getElementById('gtabs');
  GENRES.forEach(g=>{
    const t=document.createElement('div');
    t.className='gt'+(g==='Все'?' on':'');
    t.id='g_'+encodeURIComponent(g);
    t.textContent=g;
    t.onclick=()=>setG(g);
    w.appendChild(t);
  });
}

function render(){
  const q=document.getElementById('q').value.toLowerCase();
  const rc=BOOKS.filter(b=>state[b.n]).length,tot=BOOKS.length;
  document.getElementById('sR').textContent=rc;
  document.getElementById('sL').textContent=tot-rc;
  document.getElementById('sP').textContent=Math.round(rc/tot*100)+'%';
  document.getElementById('fill').style.width=(rc/tot*100)+'%';

  let list=BOOKS.filter(b=>{
    if(q&&!b.title.toLowerCase().includes(q)&&!b.author.toLowerCase().includes(q)&&!b.g.toLowerCase().includes(q)) return false;
    if(filt==='read'&&!state[b.n]) return false;
    if(filt==='unread'&&state[b.n]) return false;
    if(genre!=='Все'&&b.g!==genre) return false;
    return true;
  });

  list.sort((a,b)=>{
    const av=sk==='n'?a.n:sk==='h'?a.h:(a[sk]||'');
    const bv=sk==='n'?b.n:sk==='h'?b.h:(b[sk]||'');
    return av<bv?-sd:av>bv?sd:0;
  });

  const tb=document.getElementById('tb');
  tb.innerHTML='';
  document.getElementById('emp').style.display=list.length?'none':'block';
  list.forEach(b=>{
    const r=!!state[b.n];
    const tr=document.createElement('tr');
    tr.className=r?'r':'';
    tr.onclick=()=>toggle(b.n);
    tr.innerHTML=`<td class="cn">${b.n}</td>
      <td class="cc"><span class="ck">${r?'✓':''}</span></td>
      <td class="ct">${b.title}</td>
      <td class="ca">${b.author}</td>
      <td class="cg"><span class="pill">${b.g}</span></td>
      <td class="ch">~${b.h} ч</td>`;
    tb.appendChild(tr);
  });
}

buildTabs();load();render();
